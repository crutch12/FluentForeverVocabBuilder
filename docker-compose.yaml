version: "3.9"

services:
  web:
    build: .
    # volumes:
      # - .:/app/
    # command: bash -c "pip install -r requirements.txt && python app.py"
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
    volumes:
      - web-data:/app/app/temp

  # anki-desktop:
  #   image: mikescherbakov/anki-desktop-docker:latest
  #   container_name: anki-desktop
  #   # ports:
  #       # - "3000:3000"
  #       # - "8765:8765"
  #   volumes:
  #       - anki-data:/config/.local/share
  #   restart: unless-stopped

  tuna:
    build:
      context: .
      dockerfile: Dockerfile.tuna
    depends_on:
      - web
    restart: unless-stopped
    env_file:
      - ./.env.tuna

volumes:
    anki-data:
    web-data:
